name: Nightly distribution
on:
  schedule:
    - cron: '0 0 * * *'
  workflow_dispatch:
jobs:
  nightly-distribution:
    strategy:
      matrix:
        include:
          - scheme: "main"
          - scheme: "release-6.0"
          - scheme: "release-6.1"
          - scheme: "release-6.2"

      fail-fast: false
    uses: ./.github/workflows/distribute-toolchain.yml
    secrets: inherit
    with:
      scheme: ${{ matrix.scheme }}
      run-id: latest
